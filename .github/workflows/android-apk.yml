name: Build Karllo APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Karllo web UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy UI into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R frontend/dist/. android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools/* "${SDK_ROOT}/cmdline-tools/latest/"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" --licenses || true
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "sdk.dir=${SDK_ROOT}" > android/local.properties

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/KarlloAI-debug.apk
          ls -lh dist-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KarlloAI-debug-apk
          path: dist-apk/KarlloAI-debug.apk
          if-no-files-found: error
