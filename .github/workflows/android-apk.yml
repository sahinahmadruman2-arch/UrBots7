name: Build Karllo APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Karllo web UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy UI into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R frontend/dist/. android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/KarlloAI-debug.apk
          ls -lh dist-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KarlloAI-debug-apk
          path: dist-apk/KarlloAI-debug.apk
          if-no-files-found: error
